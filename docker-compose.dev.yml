# Build from source. Use this when hacking on jay itself; docker-compose.yml
# pulls the published image instead.
services:
  jay:
    build: .
    ports:
      - "9000:9000"
      - "9001:9001"
      - "4444:4444"
    volumes:
      - jay-data:/data
    environment:
      JAY_DATA_DIR: /data
      JAY_LISTEN_ADDR: ":9000"
      JAY_ADMIN_ADDR: ":9001"
      JAY_NATIVE_ADDR: ":4444"
      JAY_ADMIN_TOKEN: "${JAY_ADMIN_TOKEN}"
      JAY_SIGNING_SECRET: "${JAY_SIGNING_SECRET}"
      JAY_LOG_LEVEL: info
      # JAY_TLS_CERT: /data/certs/server.crt
      # JAY_TLS_KEY: /data/certs/server.key
      # JAY_RATE_LIMIT: "100"
      # JAY_RATE_BURST: "200"
      # JAY_NATIVE_MAX_CONNS: "1000"
      # JAY_NATIVE_TOKEN_BYTES_PER_SEC: "0"
      # GET /metrics takes the admin token unless one of these is set (never both):
      # JAY_METRICS_TOKEN: "${JAY_METRICS_TOKEN}"   # read-only scraper bearer, >= 32 chars
      # JAY_METRICS_PUBLIC: "true"                  # no auth on /metrics at all
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  jay-data:
