name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag pushed from dev (or any other branch) must not publish. This is
      # what actually happened for v0.14.0: tagged straight on dev, and the
      # workflow built and shipped binaries + an image before anyone noticed
      # main never got the merge. `main` is the only branch that gets to cut
      # a release; verifying it here is the one check that fails closed even
      # if a tag lands on the wrong branch again.
      - name: Require tag commit to be an ancestor of main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge dev -> main first, then tag main." >&2
            exit 1
          fi

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    # The GitHub release is what announces the image, so it is published only
    # after the image has been built, smoke tested and pushed. A release whose
    # `docker pull` line points at nothing is a broken promise.
    needs: [guard, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from the commit range since the
          # previous tag, so a shallow clone produces an empty release body.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # The tag carries a leading "v"; internal/version does not, and GoReleaser
      # strips it from {{ .Version }}. Passing the raw ref here would make the
      # image report "v0.8.2" while the binaries in the same release report
      # "0.8.2".
      - name: Build metadata
        id: vars
        run: |
          {
            echo "commit=${GITHUB_SHA::7}"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      # Smoke test before push: build the runner-native arch only, boot it, and
      # require /health/ready plus the injected version in the startup log.
      # A tag that publishes an image nobody can start is worse than no release.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jay:smoke
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name jay-smoke -p 9001:9001 \
            -e JAY_ADMIN_TOKEN="$(openssl rand -base64 32)" \
            -e JAY_SIGNING_SECRET="$(openssl rand -base64 32)" \
            jay:smoke

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9001/health/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          docker logs jay-smoke

          if [ "$ready" -ne 1 ]; then
            echo "jay never became ready" >&2
            docker rm -f jay-smoke >/dev/null 2>&1 || true
            exit 1
          fi

          expected="${GITHUB_REF_NAME#v}"
          if ! docker logs jay-smoke 2>&1 | grep -q "\"version\":\"${expected}\""; then
            echo "image reports the wrong version: expected ${expected}" >&2
            docker rm -f jay-smoke >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f jay-smoke >/dev/null 2>&1 || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ivangsm/jay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations add unknown/unknown entries to the ghcr tag listing.
          provenance: false
