name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build
        run: go build -o jay ./cmd/jay

      - name: Verify binary
        run: test -x ./jay

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # A separate job on purpose: it installs three third-party S3 clients, which
  # the unit suite has no use for, and it runs in parallel with test/build/lint
  # so the normal cycle does not get any longer.
  #
  # `go test` proves jay agrees with itself. This proves jay agrees with clients
  # it did not write — the only thing that can back the README's compatibility
  # claim. --require-all turns a client that failed to install into a failed
  # run: a skipped check is not a passing one, and a green job that quietly
  # tested nothing is exactly what this job exists to prevent.
  conformance:
    name: S3 conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      # aws-cli v2 ships with the runner image. Fail loudly if that changes
      # rather than letting the group skip.
      - name: Verify aws-cli
        run: aws --version

      # Built from source like warp: dl.min.io stopped serving the prebuilt
      # binary (410 Gone) on 2026-09-12 and took this job down with it. mc has
      # no semver tags, so @latest resolves to the head of its default branch —
      # which is the point: track what a current minio-go client does. It lands
      # in $(go env GOPATH)/bin, which conformance.sh looks in.
      - name: Install mc (minio-go)
        run: |
          set -euo pipefail
          go install github.com/minio/mc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # GITHUB_PATH only affects later steps, so the version check is its own.
      - name: Verify mc
        run: mc --version

      # warp lands in $(go env GOPATH)/bin, which conformance.sh looks in.
      # Unpinned on purpose: the point is to track what a current minio-go
      # client does, not to freeze one.
      - name: Install warp
        run: go install github.com/minio/warp@latest

      - name: Run the conformance suite
        run: scripts/conformance.sh --require-all

  # Also a separate job, and for the same reason as conformance: fuzzing is
  # open-ended work that would turn a 10-second unit cycle into a minutes-long
  # one. The seed corpus still runs inside `go test ./...` — f.Add cases
  # execute as ordinary tests — so a regression in a known-bad input is caught
  # on every push. This job is what looks for the NEXT one.
  #
  # The targets parse bytes straight off a socket, and ReadHandshake and
  # ReadHeader do it BEFORE authentication: anything that can reach the native
  # port can drive them. A crash there is reachable by an unauthenticated peer.
  fuzz:
    name: Fuzz the wire decoder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      # One target per invocation: `go test -fuzz` accepts a single pattern.
      # Sequential rather than a matrix because each run is a minute and the
      # matrix overhead would exceed the work.
      - name: Fuzz
        run: |
          set -euo pipefail
          for target in FuzzDecoder FuzzDecodeMessages FuzzReadHandshake FuzzReadHeader FuzzRoundTrip; do
            echo "::group::$target"
            go test ./proto/ -run "^${target}\$" -fuzz "^${target}\$" -fuzztime 60s
            echo "::endgroup::"
          done

      # A failing input is written to proto/testdata/fuzz/<target>/. Without
      # this the job reports a crash whose reproducer lives only on a runner
      # that is about to be destroyed.
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: proto/testdata/fuzz/
          if-no-files-found: ignore
